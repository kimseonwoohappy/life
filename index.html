<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIFE:RPG — Level up in real life</title>
<style>
  :root{
    --bg:#FFFFFF; --panel:rgba(255,255,255,.86); --panel-2:rgba(255,255,255,.72);
    --line:rgba(30,40,90,.13); --grid:rgba(30,35,80,.14); --grid-strong:rgba(30,35,80,.26);
    --text:#171A33; --muted:#5F638C;
    --gold:#C97B12; --gold-soft:rgba(201,123,18,.16); --on-gold:#FFF6E6;
    --fill:rgba(30,35,80,.05); --fill-2:rgba(30,35,80,.10);
    --shadow:0 1px 2px rgba(20,25,60,.04), 0 6px 16px rgba(20,25,60,.06), 0 24px 48px rgba(20,25,60,.07);
    --int:#1E6FC4; --vit:#C93F26; --exp:#0A8460; --soc:#6B37D8; --cre:#A56D00;
  }
  [data-theme="dark"]{
    --bg:#0F0C22; --panel:rgba(24,20,54,.78); --panel-2:rgba(28,24,62,.66);
    --line:rgba(255,255,255,.14); --grid:rgba(255,255,255,.11); --grid-strong:rgba(255,255,255,.24);
    --text:#F1EEFF; --muted:#9C96C8;
    --gold:#FFCF6E; --gold-soft:rgba(255,207,110,.14); --on-gold:#1A1330;
    --fill:rgba(255,255,255,.06); --fill-2:rgba(255,255,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 18px 50px rgba(0,0,0,.42);
    --int:#8ACBFF; --vit:#FF8E75; --exp:#6BE9B6; --soc:#CBA6FF; --cre:#FFD97A;
  }
  :root{
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans); font-weight:500;
    min-height:100vh; padding:20px 16px calc(48px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased; transition:background-color .25s,color .25s;
  }
  .wrap{max-width:1020px;margin:0 auto;position:relative}

  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:38px;height:38px;border-radius:12px;flex:0 0 38px;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--gold),#FF8E75 55%,#7C4DEC);color:#fff;
    font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:-.03em;
    box-shadow:0 6px 16px rgba(201,123,18,.25)}
  .logo{font-size:19px;font-weight:800;letter-spacing:.16em;font-family:var(--mono)}
  .logo b{color:var(--gold)}
  .tagline{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:3px}
  .hd-right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .streak{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--gold);white-space:nowrap;
    border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:var(--gold-soft)}
  .theme-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);
    border-radius:999px;width:40px;height:38px;font-size:16px;cursor:pointer;box-shadow:var(--shadow)}

  .grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
  .card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:20px;box-shadow:var(--shadow);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .card > *{position:relative;z-index:1}
  .card canvas.fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;
    pointer-events:none;display:block}

  .lvrow{display:flex;align-items:center;gap:14px}
  .lvbadge{width:64px;height:64px;flex:0 0 64px;border-radius:50%;display:grid;place-items:center;
    position:relative;background:conic-gradient(var(--gold) var(--p,0deg), var(--fill-2) 0deg)}
  .lvbadge::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
  .lvbadge span{position:relative;z-index:1;font-family:var(--mono);font-size:23px;font-weight:800}
  .lvmeta{flex:1;min-width:0}
  .lvmeta .name{font-weight:800;font-size:15px}
  .lvmeta .name small{font-weight:600}
  .lvmeta .xp{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
  .totalxp{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--gold)}

  .radar{width:100%;max-width:330px;height:auto;display:block;margin:8px auto 2px}
  .radar polygon.shape{transition:all .5s cubic-bezier(.2,.8,.2,1)}

  .stat{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:13.5px}
  .dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px;transform:rotate(45deg)}
  .stat .nm{width:64px;font-weight:700}
  .bar{flex:1;height:7px;border-radius:99px;background:var(--fill-2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .stat .lv{font-family:var(--mono);font-size:11.5px;font-weight:800;width:34px;text-align:right}
  .stat .xpv{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted);
    width:44px;text-align:right}
  .stat .bar{height:8px}

  .tabs{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);white-space:nowrap;
    padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--sans)}
  .tab[aria-selected="true"]{color:#fff;border-color:transparent}

  .quest{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;
    background:var(--fill);margin-bottom:8px;position:relative;overflow:hidden;
    transition:background .15s,transform .1s}
  .quest::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--qc,transparent)}
  .quest:hover{background:var(--fill-2)}
  .quest .q-nm{flex:1;font-size:14.5px;font-weight:600}
  .quest .q-xp{font-family:var(--mono);font-size:12.5px;font-weight:800;padding:4px 9px;
    border-radius:999px;background:color-mix(in srgb, currentColor 13%, transparent)}
  .quest .q-count{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}
  .add{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:20px;font-weight:700;cursor:pointer;
    transition:transform .1s,background .15s}
  .add:active{transform:scale(.9);background:var(--fill-2)}

  .newq{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .newq input,.newq select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:11px 12px;font-size:16px;font-weight:600;font-family:var(--sans)}
  .newq input[type=text]{flex:1;min-width:140px}
  .newq input[type=number]{width:80px;font-family:var(--mono)}
  .newq button{background:linear-gradient(180deg,var(--gold),color-mix(in srgb,var(--gold) 82%, #000));
    color:var(--on-gold);border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;
    cursor:pointer;box-shadow:0 4px 12px rgba(201,123,18,.24)}

  .sec-t{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.14em;font-weight:700;
    color:var(--muted);font-family:var(--mono);margin:0 0 13px}
  .sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
  .today{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .today .bar{height:9px}
  .today .num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
  .log{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}
  .log li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
    font-size:13.5px;font-weight:600}
  .log .t{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);width:44px}
  .log .x{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:800}
  .empty{color:var(--muted);font-size:13.5px;font-weight:500;padding:12px 0}

.stage{position:relative;height:min(58vh,430px);margin:4px 0 4px;touch-action:pan-y}
  .stage::before{content:"";position:absolute;left:50%;bottom:44px;transform:translateX(-50%);
    width:min(78%,300px);aspect-ratio:1;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 50% 55%, var(--gold-soft) 0%, transparent 62%)}
  .stage::after{content:"";position:absolute;left:50%;bottom:52px;transform:translateX(-50%);
    width:min(52%,190px);height:16px;border-radius:50%;pointer-events:none;
    background:radial-gradient(ellipse, rgba(30,35,80,.13) 0%, transparent 70%)}
  [data-theme="dark"] .stage::after{background:radial-gradient(ellipse, rgba(0,0,0,.5) 0%, transparent 70%)}
  #c3d{width:100%;height:100%;display:block;cursor:grab}
  #c3d:active{cursor:grabbing}
  .stage .hint{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:11px;
    font-weight:600;color:var(--muted);pointer-events:none}
  .views{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
  .views{gap:7px}
  .vbtn{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:999px;
    padding:9px 17px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--sans);
    transition:.15s}
  .vbtn[aria-current="true"]{box-shadow:0 4px 12px rgba(201,123,18,.22)}
  .vbtn[aria-current="true"]{background:var(--gold);color:var(--on-gold);border-color:transparent}
  .pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  .pager::-webkit-scrollbar{display:none}
  .page{flex:0 0 100%;min-width:100%;scroll-snap-align:start}
  .dots{display:flex;gap:7px;justify-content:center;align-items:center;margin:18px 0 2px}
  .dot-n{width:8px;height:8px;border-radius:99px;background:var(--fill-2);border:0;padding:0;cursor:pointer;
    transition:width .2s,background .2s}
  .dot-n[aria-current="true"]{background:var(--gold);width:24px}
  .weekwrap{position:relative}
  .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
  .goal span{position:absolute;right:0;top:-16px;font-family:var(--mono);font-size:9.5px;
    font-weight:700;color:var(--muted);letter-spacing:.04em}
  .week{display:flex;align-items:flex-end;gap:8px;position:relative;z-index:1}
  .week .col.today .d{color:var(--gold)}
  .week .col.today .v{color:var(--gold)}
  .week .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .week .stack{width:100%;border-radius:7px 7px 4px 4px;overflow:hidden;display:flex;
    flex-direction:column-reverse;background:var(--fill-2)}
  .week .stack i{display:block;width:100%}
  .week .d{font-size:10.5px;font-weight:700;color:var(--muted);font-family:var(--mono)}
  .week .v{font-family:var(--mono);font-size:10.5px;font-weight:800;color:var(--muted);height:14px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--fill);border-radius:12px;padding:13px}
  .kpi{border:1px solid var(--line)}
  .kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:800;line-height:1.15;
    letter-spacing:-.02em}
  .kpi span{font-size:11.5px;font-weight:600;color:var(--muted)}
  .rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
    font-size:13.5px;font-weight:600}
  .rank .n{font-family:var(--mono);color:var(--muted);width:16px;font-size:12px}
  .rank .c{margin-left:auto;font-family:var(--mono);font-weight:800;font-size:12.5px}
  .foot{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:11px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)}

  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);opacity:0;background:var(--gold);color:var(--on-gold);
    font-weight:800;padding:12px 22px;border-radius:999px;font-size:14px;pointer-events:none;
    transition:.35s;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.22)}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .float{position:fixed;font-family:var(--mono);font-weight:800;font-size:16px;pointer-events:none;
    z-index:9;animation:fly .9s ease-out forwards}
  @keyframes fly{to{transform:translateY(-48px);opacity:0}}
  .warn{background:var(--gold-soft);border:1px solid var(--gold);color:var(--text);font-weight:600;
    padding:10px 13px;border-radius:12px;font-size:12.5px;margin-bottom:14px}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  @media (max-width:800px){
    .grid{grid-template-columns:1fr}
    body{padding:16px 12px calc(40px + env(safe-area-inset-bottom))}
    .card{padding:15px;border-radius:14px}
    .tagline{display:none}
    .log{max-height:none}
  }
  @media (prefers-reduced-motion:reduce){.float,#toast{animation:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">LR</div>
      <div>
        <div class="logo">LIFE<b>:</b>RPG</div>
        <div class="tagline">What you do in real life becomes your stats</div>
      </div>
    </div>
    <div class="hd-right">
      <div class="streak" id="streak">0 day streak</div>
      <button class="theme-btn" id="themeBtn" aria-label="Switch theme">🌙</button>
    </div>
  </header>

  <div id="warn"></div>

  <div class="pager" id="pager">

  <!-- PAGE 1 · CHARACTER -->
  <section class="page">
    <div class="card">
      <h2 class="sec-t">YOUR CHARACTER</h2>
      <div class="stage">
        <canvas id="c3d"></canvas>
        <div class="hint" id="hint">Drag or scroll to turn</div>
      </div>
      <div class="views">
        <button class="vbtn" data-a="0" aria-current="true">Front</button>
        <button class="vbtn" data-a="90">Side</button>
        <button class="vbtn" data-a="180">Back</button>
      </div>
    </div>
  </section>

  <!-- PAGE 2 · STATS + QUESTS -->
  <section class="page">
    <div class="grid">
      <section class="card">
        <div class="lvrow">
          <div class="lvbadge" id="badge"><span id="lvNum">1</span></div>
          <div class="lvmeta">
            <div class="name">Your character <small style="color:var(--muted)">Lv.<span id="lvNum2">1</span></small></div>
            <div class="xp" id="lvXp">0 / 100 XP</div>
            <div class="totalxp" id="totalXp">0 XP total</div>
          </div>
        </div>
        <svg class="radar" viewBox="0 0 240 220" id="radar" aria-label="Stat pentagon"></svg>
        <div id="stats"></div>
      </section>

      <section class="card">
        <h2 class="sec-t">QUEST LOG · LOG WHAT YOU DID</h2>
        <div class="tabs" id="tabs" role="tablist"></div>
        <div id="quests"></div>
        <div class="newq">
          <input type="text" id="qName" placeholder="Your own quest" maxlength="26">
          <select id="qStat"></select>
          <input type="number" id="qXp" value="15" min="1" max="200">
          <button id="qAdd">Add</button>
        </div>
      </section>
    </div>

    <section class="card" style="margin-top:16px">
      <h2 class="sec-t">TODAY · <span id="dateLabel"></span></h2>
      <div class="today">
        <div class="bar"><i id="todayBar" style="background:var(--gold);width:0%"></i></div>
        <div class="num"><span id="todayXp">0</span> / 100 XP</div>
      </div>
      <ul class="log" id="log"></ul>
      <div class="foot">
        <button class="ghost" id="undo">Undo last entry</button>
        <button class="ghost" id="reset">Reset everything</button>
      </div>
    </section>
  </section>

  <!-- PAGE 3 · STATS -->
  <section class="page">
    <div class="card">
      <h2 class="sec-t">LAST 7 DAYS</h2>
      <div class="weekwrap"><div class="week" id="week"></div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2 class="sec-t">ALL TIME</h2>
      <div class="kpis" id="kpis"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2 class="sec-t">MOST LOGGED</h2>
      <div id="topq"></div>
    </div>
  </section>
  </div>

  <div class="dots">
    <button class="dot-n" data-p="0" aria-current="true" aria-label="Character"></button>
    <button class="dot-n" data-p="1" aria-label="Stats and quests"></button>
    <button class="dot-n" data-p="2" aria-label="History"></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div id="toast"></div>

<script>
const FRAG = `#version 300 es
precision highp float;
uniform vec2 iResolution; uniform float iTime;
uniform float uSpeed,uAmplitude,uWaveScale,uWaveRatio,uSwell,uTurbulence,uTilt,uZoom,uHeight;
uniform float uFogDepth,uSteps,uBrightness,uOpacity,uGrainIntensity,uParallax;
uniform vec2 uMouse;
uniform vec3 uHorizonColor,uWaveColor,uCrestColor;
out vec4 fragColor;
const float MAX_DIST=20000.0;
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float plasma(vec3 r,vec2 freq,vec4 tc){
  float mx=r.x+tc.x; mx+=uSwell*sin((r.y+mx)/20.0+tc.y);
  float my=r.y-tc.z; my+=uTurbulence*cos(r.x/23.0+tc.w);
  return r.z-(sin(mx*freq.x)*uAmplitude+sin(my*freq.y)*uAmplitude+uHeight);
}
float raymarch(vec3 pos,vec3 dir,vec2 freq,vec4 tc){
  float dist=0.0;
  for(int i=0;i<128;i++){
    if(float(i)>=uSteps) break;
    float d=plasma(pos+dist*dir,freq,tc);
    if(abs(d)<0.1) break;
    dist+=0.9*d;
    if(!(abs(dist)<MAX_DIST)) return MAX_DIST;
  }
  return dist;
}
void main(){
  float T=iTime*uSpeed;
  vec2 freq=vec2(uWaveScale/7.0,(uWaveScale*uWaveRatio)/3.0);
  vec4 tc=vec4(T/0.130,T/0.810,T/0.200,T/0.710);
  float c,s;
  float vfov=(3.14159/2.3)/max(uZoom,0.05);
  vec3 cam=vec3(0.0,0.0,30.0);
  vec2 uv=(gl_FragCoord.xy/iResolution.xy)-0.5;
  uv.x*=iResolution.x/iResolution.y; uv.y*=-1.0;
  vec3 dir=vec3(0.0,0.0,-1.0);
  float ulen=length(uv);
  float xrot=vfov*ulen; c=cos(xrot); s=sin(xrot);
  dir=mat3(1.0,0.0,0.0, 0.0,c,-s, 0.0,s,c)*dir;
  vec2 nuv= ulen>1e-5 ? uv/ulen : vec2(1.0,0.0);
  c=nuv.x; s=nuv.y;
  dir=mat3(c,-s,0.0, s,c,0.0, 0.0,0.0,1.0)*dir;
  c=cos(uTilt); s=sin(uTilt);
  dir=mat3(c,0.0,s, 0.0,1.0,0.0, -s,0.0,c)*dir;
  float yaw=(uMouse.x-0.5)*uParallax*0.4, pitch=(uMouse.y-0.5)*uParallax*0.4;
  c=cos(yaw); s=sin(yaw); dir=mat3(c,0.0,s, 0.0,1.0,0.0, -s,0.0,c)*dir;
  c=cos(pitch); s=sin(pitch); dir=mat3(1.0,0.0,0.0, 0.0,c,-s, 0.0,s,c)*dir;
  float dist=raymarch(cam,dir,freq,tc);
  vec3 pos=cam+dist*dir;
  float t=clamp(uFogDepth/max(dist,0.001),0.0,1.0);
  vec3 body=mix(uWaveColor,uCrestColor,clamp(pos.z*0.08+0.5,0.0,1.0));
  vec3 col=mix(uHorizonColor,body,t);
  col=clamp(col*uBrightness,0.0,1.0);
  float alpha=clamp(t,0.0,1.0)*uOpacity;
  float g=hash21(gl_FragCoord.xy+mod(iTime,64.0)*11.0);
  alpha=clamp(alpha+(g-0.5)*uGrainIntensity,0.0,1.0);
  fragColor=vec4(col*alpha,alpha);
}`;
const VERT = `#version 300 es
void main(){ vec2 p=vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
  gl_Position=vec4(p*2.0-1.0,0.0,1.0); }`;

/* ---------- 3D chibi character (three.js, procedural) ---------- */
function initCharacter(){
  const cvs=document.getElementById("c3d");
  if(!window.THREE||!cvs) return null;
  const R=new THREE.WebGLRenderer({canvas:cvs,alpha:true,antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio||1,2));
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(30,1,0.1,100);

  scene.add(new THREE.HemisphereLight(0xffffff,0x9AA6C8,0.9));
  const key=new THREE.DirectionalLight(0xffffff,0.9); key.position.set(4,7,6); scene.add(key);
  const rim=new THREE.DirectionalLight(0xFFC2E8,0.45); rim.position.set(-5,3,-6); scene.add(rim);

  const root=new THREE.Group(); scene.add(root);
  const M=(c,r=0.95)=>new THREE.MeshStandardMaterial({color:new THREE.Color(c),roughness:r,metalness:0});
  const SKIN=M("#F5CFA8"), HAIR=M("#4A3A34",0.8), PANTS=M("#3E4B70"), SHOE=M("#2A2E44",0.7);
  const SHIRT=M("#5227FF",0.9), EYE=M("#20223A",0.4), MOUTH=M("#8A4A44",0.6);
  const BLUSH=new THREE.MeshStandardMaterial({color:new THREE.Color("#FF9BB0"),roughness:1,
    transparent:true,opacity:0.55});
  const add=(geo,mat,x,y,z,rx,ry,rz,sx,sy,sz)=>{
    const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z);
    m.rotation.set(rx||0,ry||0,rz||0); m.scale.set(sx||1,sy||sx||1,sz||sx||1);
    root.add(m); return m;
  };
  const SPH=(r,s)=>new THREE.SphereGeometry(r,s||28,s||22);
  const CYL=(a,b,h)=>new THREE.CylinderGeometry(a,b,h,24);

  /* 3등신: 총 높이 3.0 = 머리 1.0 + 몸통·다리 2.0 */
  add(CYL(0.155,0.15,0.62),PANTS,-0.19,0.42,0); add(CYL(0.155,0.15,0.62),PANTS,0.19,0.42,0);
  add(SPH(0.19),SHOE,-0.19,0.13,0.05,0,0,0,1,0.8,1.35);
  add(SPH(0.19),SHOE, 0.19,0.13,0.05,0,0,0,1,0.8,1.35);
  add(CYL(0.44,0.36,0.92),SHIRT,0,1.16,0);
  add(SPH(0.44),SHIRT,0,1.62,0,0,0,0,1,0.75,1);
  add(SPH(0.36),SHIRT,0,0.72,0,0,0,0,1,0.8,1);
  const armL=add(CYL(0.115,0.10,0.62),SHIRT,-0.50,1.28,0,0,0,0.22);
  const armR=add(CYL(0.115,0.10,0.62),SHIRT, 0.50,1.28,0,0,0,-0.22);
  add(SPH(0.135),SKIN,-0.57,0.95,0); add(SPH(0.135),SKIN,0.57,0.95,0);
  add(CYL(0.16,0.16,0.14),SKIN,0,1.75,0);

  const head=new THREE.Group(); head.position.set(0,2.30,0); root.add(head);
  const hm=(geo,mat,x,y,z,sx,sy,sz)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
    m.scale.set(sx||1,sy||sx||1,sz||sx||1); head.add(m); return m;};
  hm(SPH(0.5,36),SKIN,0,0,0,1.02,0.98,0.96);
  hm(new THREE.SphereGeometry(0.515,36,26,0,Math.PI*2,0,Math.PI*0.52),HAIR,0,0.015,0,1.03,1.05,1.02);
  hm(SPH(0.075,18),EYE,-0.175,0.06,0.455,1,1.25,0.7);
  hm(SPH(0.075,18),EYE, 0.175,0.06,0.455,1,1.25,0.7);
  hm(SPH(0.026,12),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3}),-0.20,0.11,0.50,1,1,0.6);
  hm(SPH(0.026,12),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3}), 0.15,0.11,0.50,1,1,0.6);
  hm(SPH(0.048,14),MOUTH,0,-0.13,0.475,1.5,0.9,0.5);
  hm(SPH(0.10,16),BLUSH,-0.31,-0.05,0.375,1,0.7,0.4);
  hm(SPH(0.10,16),BLUSH, 0.31,-0.05,0.375,1,0.7,0.4);

  const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.78,32),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.12}));
  shadow.rotation.x=-Math.PI/2; shadow.position.y=0.005; root.add(shadow);

  let rot=0, target=0, drag=false, lastX=0, touched=false;
  const norm=a=>((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  cvs.addEventListener("pointerdown",e=>{drag=true;lastX=e.clientX;touched=true;cvs.setPointerCapture(e.pointerId);});
  cvs.addEventListener("pointermove",e=>{ if(!drag) return; target+=(e.clientX-lastX)*0.012; lastX=e.clientX; });
  const up=()=>drag=false;
  cvs.addEventListener("pointerup",up); cvs.addEventListener("pointercancel",up);
  cvs.addEventListener("wheel",e=>{ e.preventDefault(); target+=e.deltaY*0.004; touched=true; },{passive:false});
  [...document.querySelectorAll(".vbtn")].forEach(b=>b.addEventListener("click",()=>{
    const want=+b.dataset.a*Math.PI/180;
    target=Math.round((target-want)/(Math.PI*2))*(Math.PI*2)+want; touched=true;
  }));
  const vbtns=[...document.querySelectorAll(".vbtn")];
  const resize=()=>{ const r=cvs.parentElement.getBoundingClientRect();
    if(r.width<2) return;
    R.setSize(r.width,r.height,false);
    cam.aspect=r.width/r.height; cam.updateProjectionMatrix();
    const fit = r.width<340 ? 8.6 : 7.8;
    cam.position.set(0,1.62,fit); cam.lookAt(0,1.45,0); };
  addEventListener("resize",resize); setTimeout(resize,0);

  return {
    tint(hex){ SHIRT.color.set(hex); },
    draw(sec){
      const r=cvs.getBoundingClientRect();
      if(r.right<0||r.left>innerWidth||r.width<2) return;
      if(!R.domElement.width||Math.abs(R.domElement.clientWidth-r.width)>1) resize();
      if(!touched) target+=0.0035;
      rot+=(target-rot)*0.12;
      root.rotation.y=rot;
      root.position.y=Math.sin(sec*1.7)*0.028;
      head.rotation.z=Math.sin(sec*1.1)*0.025;
      const a=norm(rot), deg=a*180/Math.PI;
      const near=[0,90,180,270].reduce((p,c)=>Math.abs(((deg-c+540)%360)-180)>Math.abs(((deg-p+540)%360)-180)?p:c);
      vbtns.forEach(b=>b.setAttribute("aria-current", (+b.dataset.a===near)?"true":"false"));
      R.render(scene,cam);
    }
  };
}

/* ---------- card interior: gradient waves ---------- */
const MOBILE = matchMedia("(max-width:800px)").matches;
const STILL  = matchMedia("(prefers-reduced-motion:reduce)").matches;
const S_PAGE = MOBILE ? 0.60 : 0.85;
const S_CARD = MOBILE ? 0.55 : 0.80;
const hexRgb = h => [1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);

const CARD_PALETTE = {
  light:{ horizon:"#FFFFFF", wave:"#5C7DFF", crest:"#FFB0E0", opacity:0.42, brightness:1.02 },
  dark:{  horizon:"#3A1E8C", wave:"#5227FF", crest:"#FF9FFC", opacity:0.62, brightness:1.0 }
};

const mouse = { nx:.5, ny:.5, px:0, py:0 };
addEventListener("pointermove", e=>{
  mouse.nx = e.clientX/innerWidth;
  mouse.ny = 1 - e.clientY/innerHeight;
  mouse.px = e.clientX; mouse.py = innerHeight - e.clientY;
});

function glLayer(canvas, frag){
  const gl = canvas.getContext("webgl2",{alpha:true,premultipliedAlpha:true,antialias:false});
  if(!gl) return null;
  const sh=(t,x)=>{const o=gl.createShader(t);gl.shaderSource(o,x);gl.compileShader(o);return o;};
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,VERT));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,frag));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){ console.warn(gl.getProgramInfoLog(p)); return null; }
  gl.useProgram(p);
  const cache={}, loc=n=>(n in cache?cache[n]:(cache[n]=gl.getUniformLocation(p,n)));
  return {
    gl,
    f:(n,v)=>gl.uniform1f(loc(n),v),
    i:(n,v)=>gl.uniform1i(loc(n),v),
    v2:(n,a,b)=>gl.uniform2f(loc(n),a,b),
    v3:(n,a,b,c)=>gl.uniform3f(loc(n),a,b,c),
    rgb:(n,hex)=>gl.uniform3fv(loc(n),hexRgb(hex)),
    size(w,h){ canvas.width=Math.max(1,w); canvas.height=Math.max(1,h); gl.viewport(0,0,canvas.width,canvas.height); },
    render(){ gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES,0,3); }
  };
}

/* 카드 내부 = 그라디언트 웨이브 (한 번 렌더 → 카드별로 잘라 붙이기) */
function initCards(){
  const src=document.createElement("canvas");
  const L=glLayer(src, FRAG); if(!L) return null;
  L.f("uSpeed",0.4); L.f("uAmplitude",2.5); L.f("uWaveScale",0.6); L.f("uWaveRatio",0.9);
  L.f("uSwell",35); L.f("uTurbulence",20); L.f("uTilt",1.11); L.f("uZoom",1.0);
  L.f("uHeight",5.5); L.f("uFogDepth",15); L.f("uGrainIntensity",0.05); L.f("uParallax",0.5);
  L.f("uSteps", MOBILE?40:70);
  const resize=()=>{ const w=Math.floor(innerWidth*S_CARD), h=Math.floor(innerHeight*S_CARD);
    L.size(w,h); L.v2("iResolution",w,h); };
  addEventListener("resize",resize); resize();
  const cards=[...document.querySelectorAll(".card")].map(el=>{
    const cv=document.createElement("canvas"); cv.className="fx"; el.appendChild(cv);
    return {el, cv, ctx:cv.getContext("2d"), w:0, h:0};
  });
  return {
    paint(theme){ const t=CARD_PALETTE[theme];
      L.rgb("uHorizonColor",t.horizon); L.rgb("uWaveColor",t.wave); L.rgb("uCrestColor",t.crest);
      L.f("uOpacity",t.opacity); L.f("uBrightness",t.brightness); if(STILL) this.draw(0); },
    draw(sec){
      L.f("iTime",sec); L.v2("uMouse",mouse.nx,mouse.ny); L.render();
      for(const c of cards){
        const r=c.el.getBoundingClientRect();
        if(r.bottom<0||r.top>innerHeight||r.right<0||r.left>innerWidth||r.width<2) continue;
        const w=Math.max(1,Math.round(r.width*S_CARD)), h=Math.max(1,Math.round(r.height*S_CARD));
        if(c.w!==w||c.h!==h){ c.cv.width=w; c.cv.height=h; c.w=w; c.h=h; }
        c.ctx.clearRect(0,0,w,h);
        c.ctx.drawImage(src, Math.round(r.left*S_CARD), Math.round(r.top*S_CARD), w, h, 0,0,w,h);
      }
    }
  };
}

const KEY="liferpg:v1", TKEY="liferpg:theme", DAILY_GOAL=100;

const sc = k => STATS[k][theme];

/* 저장소: 아티팩트에서는 window.storage, 일반 웹에서는 localStorage */
const store = {
  async get(k){
    if(window.storage) return await window.storage.get(k);
    const v=localStorage.getItem(k);
    if(v===null) throw new Error("not found");
    return {key:k, value:v};
  },
  async set(k,v){
    if(window.storage) return await window.storage.set(k,v);
    localStorage.setItem(k,v); return {key:k, value:v};
  }
};

async function load(){
  try{ const r=await store.get(KEY); if(r&&r.value) state=Object.assign(state,JSON.parse(r.value)); }catch(e){}
  try{ const t=await store.get(TKEY); if(t&&t.value) theme=t.value; }catch(e){}
  applyTheme();
}
async function save(){
  try{ await store.set(KEY,JSON.stringify(state)); }
  catch(e){ if(storageOK){ storageOK=false;
    document.getElementById("warn").innerHTML='<div class="warn">Entries aren\'t being saved. They\'ll only last this session.</div>'; } }
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme",theme);
  document.getElementById("themeBtn").textContent = theme==="light" ? "🌙" : "☀️";
  if(cardFX) cardFX.paint(theme);
}

const need = lv => 100+(lv-1)*60;
function levelOf(xp){ let lv=1,rest=xp; while(rest>=need(lv)){ rest-=need(lv); lv++; } return {lv,rest,need:need(lv)}; }
const statLv = xp => Math.floor(xp/80)+1;
const today = () => new Date().toISOString().slice(0,10);
const allQuests = () => BASE_QUESTS.concat(state.custom);

function streakDays(){
  if(!state.days.length) return 0;
  const s=[...new Set(state.days)].sort().reverse(); const d=new Date(); let n=0;
  const iso=x=>x.toISOString().slice(0,10);
  if(s[0]!==iso(d)){ d.setDate(d.getDate()-1); if(s[0]!==iso(d)) return 0; }
  for(const day of s){ if(day===iso(d)){ n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}

function renderChar(){
  const {lv,rest,need:n}=levelOf(state.xp);
  lvNum.textContent=lv; lvNum2.textContent=lv;
  lvXp.textContent=`${rest} / ${n} XP`;
  totalXp.textContent=`${state.xp} XP total`;
  badge.style.setProperty("--p",(rest/n*360)+"deg");
  const st=streakDays(); streak.textContent = st===1 ? "1 day streak" : st+" day streak";

  const keys=Object.keys(STATS);
  const max=Math.max(200,...keys.map(k=>state.stats[k]))*1.1;
  const cx=120,cy=104,R=78;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  let g="";
  [0.25,0.5,0.75,1].forEach(f=>{
    const p=keys.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(",")).join(" ");
    g+=`<polygon points="${p}" fill="none" stroke="${f===1?'var(--grid-strong)':'var(--grid)'}" stroke-width="1"/>`;
  });
  keys.forEach((_,i)=>{const [x,y]=pt(i,R);
    g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)"/>`;});
  const shape=keys.map((k,i)=>{
    const r=R*Math.max(0.06,Math.min(1,state.stats[k]/max));
    return pt(i,r).map(v=>v.toFixed(1)).join(",");
  }).join(" ");
  g+=`<polygon class="shape" points="${shape}" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>`;
  keys.forEach((k,i)=>{
    const r=R*Math.max(0.06,Math.min(1,state.stats[k]/max)); const [px,py]=pt(i,r);
    g+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.4" fill="${sc(k)}"/>`;
  });
  keys.forEach((k,i)=>{const [x,y]=pt(i,R+21);
    g+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700"
      fill="${sc(k)}" font-family="system-ui">${STATS[k].name}</text>`;});
  radar.innerHTML=g;

  stats.innerHTML=keys.map(k=>{
    const xp=state.stats[k],pct=(xp%80)/80*100;
    return `<div class="stat"><span class="dot" style="background:${sc(k)}"></span>
      <span class="nm">${STATS[k].name}</span>
      <span class="bar"><i style="width:${pct}%;background:${sc(k)}"></i></span>
      <span class="xpv">${xp}xp</span>
      <span class="lv" style="color:${sc(k)}">Lv.${statLv(xp)}</span></div>`;
  }).join("");

  if(char3d){
    const topK=keys.reduce((a,b)=>state.stats[a]>=state.stats[b]?a:b);
    char3d.tint(state.xp ? sc(topK) : (theme==="light"?"#5C7DFF":"#5227FF"));
  }
}

function renderQuests(){
  tabs.innerHTML=Object.keys(STATS).map(k=>{
    const on=k===tab;
    return `<button class="tab" role="tab" aria-selected="${on}" data-k="${k}"
      style="${on?`background:${sc(k)}`:""}">${STATS[k].label}</button>`;
  }).join("");
  const c={}; state.log.forEach(l=>c[l.qid]=(c[l.qid]||0)+1);
  quests.innerHTML=allQuests().filter(q=>q.stat===tab).map(q=>`
    <div class="quest" style="--qc:${sc(q.stat)}">
      <span class="q-nm">${q.name}</span>
      <span class="q-count">${c[q.id]?"×"+c[q.id]:""}</span>
      <span class="q-xp" style="color:${sc(q.stat)}">+${q.xp}</span>
      <button class="add" data-q="${q.id}" aria-label="Log ${q.name}">＋</button>
    </div>`).join("");
}

function renderLog(){
  const t=today(), todays=state.log.filter(l=>l.d===t);
  const sum=todays.reduce((a,b)=>a+b.xp,0);
  todayXp.textContent=sum;
  todayBar.style.width=Math.min(100,sum/DAILY_GOAL*100)+"%";
  dateLabel.textContent=t.replace(/-/g,".");
  log.innerHTML= todays.length
    ? [...todays].reverse().map(l=>`<li><span class="t">${l.time}</span>
        <span class="dot" style="background:${sc(l.stat)}"></span><span>${l.name}</span>
        <span class="x" style="color:${sc(l.stat)}">+${l.xp}</span></li>`).join("")
    : `<div class="empty">Nothing logged yet. Tap a quest above to start.</div>`;
}
function longestStreak(){
  const s=[...new Set(state.days)].sort(); if(!s.length) return 0;
  let best=1,run=1;
  for(let i=1;i<s.length;i++){
    const prev=new Date(s[i-1]), cur=new Date(s[i]);
    run = (cur-prev)/86400000===1 ? run+1 : 1;
    best=Math.max(best,run);
  }
  return best;
}
function renderStats(){
  const iso=d=>d.toISOString().slice(0,10);
  const per=[...Array(7)].map((_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    const t=iso(d), e=state.log.filter(l=>l.d===t), by={};
    e.forEach(l=>by[l.stat]=(by[l.stat]||0)+l.xp);
    return {d, total:e.reduce((a,b)=>a+b.xp,0), by};
  });
  const max=Math.max(DAILY_GOAL,...per.map(p=>p.total)), H=104;
  const DAY=["S","M","T","W","T","F","S"];
  const goalPx = 19 + Math.min(H, DAILY_GOAL/max*H);
  week.innerHTML=per.map((p,idx)=>{
    const h=Math.max(4, p.total/max*H);
    const segs=Object.keys(STATS).filter(k=>p.by[k])
      .map(k=>`<i style="height:${(p.by[k]/p.total*100).toFixed(1)}%;background:${sc(k)}"></i>`).join("");
    return `<div class="col${idx===6?" today":""}"><span class="v">${p.total||""}</span>
      <div class="stack" style="height:${h.toFixed(0)}px">${segs}</div>
      <span class="d">${DAY[p.d.getDay()]}</span></div>`;
  }).join("");
  const wrap=week.parentElement;
  let g=wrap.querySelector(".goal");
  if(!g){ g=document.createElement("div"); g.className="goal";
    g.innerHTML=`<span>GOAL ${DAILY_GOAL}</span>`; wrap.appendChild(g); }
  g.style.bottom=goalPx.toFixed(0)+"px";

  const best=state.log.reduce((m,l)=>{ m[l.d]=(m[l.d]||0)+l.xp; return m; },{});
  const bestDay=Math.max(0,...Object.values(best));
  const top=Object.keys(STATS).reduce((a,b)=>state.stats[a]>=state.stats[b]?a:b);
  kpis.innerHTML=[
    [state.xp,"Total XP"],
    [state.log.length,"Entries logged"],
    [new Set(state.days).size,"Active days"],
    [longestStreak(),"Longest streak"],
    [bestDay,"Best single day"],
    [state.xp?STATS[top].name:"—","Strongest stat"]
  ].map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");

  const c={}; state.log.forEach(l=>{ c[l.name]=c[l.name]||{n:0,stat:l.stat}; c[l.name].n++; });
  const rows=Object.entries(c).sort((a,b)=>b[1].n-a[1].n).slice(0,6);
  topq.innerHTML=rows.length
    ? rows.map(([nm,o],i)=>`<div class="rank"><span class="n">${i+1}</span>
        <span class="dot" style="background:${sc(o.stat)}"></span><span>${nm}</span>
        <span class="c" style="color:${sc(o.stat)}">×${o.n}</span></div>`).join("")
    : `<div class="empty">No history yet.</div>`;
}
function renderAll(){ renderChar(); renderQuests(); renderLog(); renderStats(); }

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2000); }
function floatXp(el,txt,color){ const r=el.getBoundingClientRect(); const s=document.createElement("div");
  s.className="float"; s.textContent=txt; s.style.color=color; s.style.left=r.left+"px"; s.style.top=(r.top-6)+"px";
  document.body.appendChild(s); setTimeout(()=>s.remove(),900); }

function logQuest(q,el){
  const before=levelOf(state.xp).lv, d=new Date();
  state.xp+=q.xp; state.stats[q.stat]+=q.xp;
  state.log.push({qid:q.id,name:q.name,stat:q.stat,xp:q.xp,d:today(),
    time:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")});
  if(!state.days.includes(today())) state.days.push(today());
  renderAll(); save();
  if(el) floatXp(el,"+"+q.xp,sc(q.stat));
  if(navigator.vibrate) navigator.vibrate(12);
  const after=levelOf(state.xp).lv;
  if(after>before) toast(`LEVEL UP  Lv.${after}`);
}

tabs.addEventListener("click",e=>{const b=e.target.closest(".tab"); if(!b)return; tab=b.dataset.k; renderQuests();});
quests.addEventListener("click",e=>{const b=e.target.closest(".add"); if(!b)return;
  const q=allQuests().find(x=>x.id===b.dataset.q); if(q) logQuest(q,b);});
document.getElementById("themeBtn").addEventListener("click",async()=>{
  theme = theme==="light" ? "dark" : "light";
  applyTheme(); renderAll();
  try{ await store.set(TKEY,theme); }catch(e){}
});
qAdd.addEventListener("click",()=>{
  const nm=qName.value.trim(), st=qStat.value;
  const xp=Math.max(1,Math.min(200,parseInt(qXp.value)||10));
  if(!nm){ toast("Name your quest first"); return; }
  state.custom.push({id:"c"+Date.now(),stat:st,name:nm,xp});
  qName.value=""; tab=st; renderQuests(); save();
});
undo.addEventListener("click",()=>{
  const last=state.log.pop();
  if(!last){ toast("Nothing to undo"); return; }
  state.xp-=last.xp; state.stats[last.stat]-=last.xp;
  if(!state.log.some(l=>l.d===last.d)) state.days=state.days.filter(d=>d!==last.d);
  renderAll(); save(); toast(`Undone · ${last.name}`);
});
reset.addEventListener("click",()=>{
  if(!confirm("This clears every entry and all stats. Continue?")) return;
  state={xp:0,stats:{INT:0,VIT:0,EXP:0,SOC:0,CRE:0},log:[],custom:[],days:[]};
  renderAll(); save();
});
const dots=[...document.querySelectorAll(".dot-n")];
dots.forEach(d=>d.addEventListener("click",()=>{
  pager.scrollTo({left: pager.clientWidth*(+d.dataset.p), behavior:"smooth"});
}));
pager.addEventListener("scroll",()=>{
  const i=Math.round(pager.scrollLeft/pager.clientWidth);
  dots.forEach((d,n)=>d.setAttribute("aria-current", n===i ? "true":"false"));
},{passive:true});

qStat.innerHTML=Object.keys(STATS).map(k=>`<option value="${k}">${STATS[k].label}</option>`).join("");

cardFX = initCards();
char3d = initCharacter();
(function(){
  const t0=performance.now(); let raf=0;
  const frame=t=>{ const sec=(t-t0)*0.001;
    if(cardFX) cardFX.draw(sec);
    if(char3d) char3d.draw(sec);
    if(!STILL) raf=requestAnimationFrame(frame); };
  const start=()=>{ if(!raf) raf=requestAnimationFrame(frame); };
  const stop=()=>{ cancelAnimationFrame(raf); raf=0; };
  document.addEventListener("visibilitychange",()=>document.hidden?stop():start());
  start();
})();

(async()=>{ await load(); renderAll(); })();
</script>
